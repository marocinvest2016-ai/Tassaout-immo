<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tassaout Immo & Media - الوكيل الذكي + 11 وكيل</title>
    <style>
        body { background-color: #062314; color: #f8fafc; font-family: Tahoma, sans-serif; padding: 20px; margin: 0; }
        header { text-align: center; margin-bottom: 25px; background: linear-gradient(135deg, #0f3d24, #800020); padding: 20px; border-radius: 12px; }
        header h1 { color: #D4AF37; margin-bottom: 5px; }
        header p { color: #a3e635; font-size: 14px; }
        .omega-badge { background: linear-gradient(45deg, #800020, #D4AF37); color: #000; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; }

        .main-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1400px; margin: 0 auto 30px auto; }
        
        .admin-panel { background-color: #0f3d24; border: 2px solid #22c55e; border-radius: 12px; padding: 20px; flex: 1; min-width: 320px; max-width: 550px; }
        .agent-panel { background-color: #03160b; border: 2px solid #16a34a; border-radius: 12px; padding: 20px; flex: 1; min-width: 320px; max-width: 550px; display: flex; flex-direction: column; }
        
        .chat-history { background-color: #062314; border: 1px solid #14532d; border-radius: 8px; height: 230px; overflow-y: auto; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
        .chat-msg { padding: 8px 12px; border-radius: 8px; max-width: 85%; line-height: 1.4; }
        .agent-msg { background-color: #14532d; color: #4ade80; align-self: flex-start; border-right: 3px solid #22c55e; }
        .user-msg { background-color: #0f3d24; color: #f8fafc; align-self: flex-end; border-left: 3px solid #16a34a; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; color: #4ade80; font-weight: bold; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #22c55e; background-color: #062314; color: #fff; box-sizing: border-box; font-size: 14px; }
        
        .btn { background-color: #22c55e; color: #000; padding: 10px; border: none; border-radius: 8px; width: 100%; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn:hover { background-color: #16a34a; }
        .btn-gold { background: #D4AF37; }
        .btn-red { background: #ef4444; color: #fff; }

        .filter-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .filter-btn { background-color: #0f3d24; color: #4ade80; border: 1px solid #22c55e; padding: 8px 16px; border-radius: 20px; cursor: pointer; }
        .filter-btn.active { background-color: #22c55e; color: #000; font-weight: bold; }

        .listings-grid { display: flex; flex-wrap: wrap; gap: 25px; justify-content: center; max-width: 1400px; margin: 0 auto; }
        .prop-card { border: 1px solid #22c55e; background-color: #0f3d24; border-radius: 12px; width: 320px; padding: 15px; }
        .card-images { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; }
        .card-images img { width: 100px; height: 75px; object-fit: cover; border-radius: 6px; border: 1px solid #22c55e; cursor: pointer; }
        
        .badge { background: #22c55e; color: #000; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .
